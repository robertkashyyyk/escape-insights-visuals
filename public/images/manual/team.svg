<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <rect width="380" height="720" fill="#F6F8FB"/>

  <!-- Users icon -->
  <g transform="translate(190 150)" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-9" cy="-6" r="9"/>
    <path d="M-26 20a17 17 0 0 1 34 0"/>
    <circle cx="15" cy="-3" r="7" opacity="0.85"/>
    <path d="M8 18a14 14 0 0 1 26 -1" opacity="0.85"/>
  </g>

  <text x="190" y="238" text-anchor="middle" fill="#141B2B" font-size="27" font-weight="700">Who are you today?</text>
  <text x="190" y="268" text-anchor="middle" fill="#5A6579" font-size="14.5">Sunshine team — tap your name so your</text>
  <text x="190" y="288" text-anchor="middle" fill="#5A6579" font-size="14.5">work is logged to you.</text>

  <!-- Member buttons -->
  <g font-size="17" font-weight="600" text-anchor="middle">
    <rect x="60" y="330" width="260" height="52" rx="13" fill="#2563EB"/>
    <text x="190" y="362" fill="#FFFFFF">Sarah</text>

    <rect x="60" y="394" width="260" height="52" rx="13" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1.5"/>
    <text x="190" y="426" fill="#141B2B">James</text>

    <rect x="60" y="458" width="260" height="52" rx="13" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1.5"/>
    <text x="190" y="490" fill="#141B2B">Aoife</text>

    <rect x="60" y="522" width="260" height="52" rx="13" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1.5"/>
    <text x="190" y="554" fill="#141B2B">Conor</text>
  </g>

  <text x="190" y="612" text-anchor="middle" fill="#8A93A5" font-size="14">Cancel</text>
</svg>
