project_id = "pftqjrmdksrrpczhomln"

# Auth-gated: verify_jwt=true so the platform verifies the JWT signature; each function
# also rejects anon via _shared/auth.ts (service_role + authenticated only).
[functions.generate-daily-cleaning-schedule]
verify_jwt = true

[functions.generate-orin-brief]
verify_jwt = true

[functions.orin-chat]
verify_jwt = false

[functions.notify-urgent-issue]
verify_jwt = true

# Called by the hostaway-auto-sync cron (now sends the service_role JWT via
# edge_auth_header) and by the frontend (logged-in user JWT). Gated on.
[functions.hostaway-sync]
verify_jwt = true

[functions.ota-ingest]
verify_jwt = true

# Called only by the stripe-auto-sync cron (now sends the service_role JWT).
[functions.stripe-sync]
verify_jwt = true

# Sender / privileged functions — verify_jwt=true + rejectAnon (service_role from their
# DB triggers/crons, or authenticated from the frontend).
[functions.notify-cleaner-schedule-update]
verify_jwt = true

[functions.send-owner-booking-email]
verify_jwt = true

[functions.send-owner-orin-digest]
verify_jwt = true

[functions.send-booking-notification]
verify_jwt = true

[functions.manage-cron]
verify_jwt = true

# Admin-only mutation endpoints. Their own getUser + super-role gate already rejects
# anon; verify_jwt=true adds a gateway backstop (they're always called with a
# logged-in user JWT from the admin UI). orin-chat stays verify_jwt=false by design
# (streaming chat with its own getUser gate).
[functions.invite-user]
verify_jwt = true

[functions.manage-users]
verify_jwt = true
